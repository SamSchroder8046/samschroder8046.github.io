<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sam T. Schroder</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous" defer></script>
    <script src="scripts.js" defer></script>
</head>
<body>
<header>
    <h1>Sam T. Schroder</h1>
    <nav>
        <a class="nav-item" href="index.html">Projects</a>
        <a class="nav-item" href="contact.html">Contact</a>
    </nav>
</header>
<main>
    <div class="wrapper container">
        <div class="message-container">
            <p><strong>Please reach out for any questions!</strong><br>
                Fill in the form below to contact me.<br>
            </p>
        </div>
        <h2>Contact Me:</h2>
        <div class="contact-form-container">
            <form
                    class="form"
                    id="contact-form"
                    action="https://formspree.io/f/meaavovr"
                    method="POST"
            >
                <div id="contact-form-inputs-container">
                    <label>
                        Your email:
                    </label>
                    <input required type="email" name="email">
                    <label>
                        Your message:
                    </label>
                    <textarea required id="message-area" name="message"></textarea>
                </div>
                <button type="submit">Send</button>
            </form>
    </div>
</main>
</body>
</html>
