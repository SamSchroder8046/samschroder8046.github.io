<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sam T. Schroder</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous" defer></script>
    <script src="scripts.js" defer></script>
</head>
<body>
<header>
    <h1>Sam T. Schroder</h1>
    <nav>
        <a class="nav-item" href="index.html">Projects</a>
        <a class="nav-item" href="contact.html">Contact</a>
    </nav>
</header>
<main>
    <div class="wrapper container">
        <div class="message-container">
            <p><strong>Please reach out for any questions!</strong><br>
                Fill in the form below to contact me.<br>
            </p>
        </div>
        <div class="contact-form-container">
            <h2>Contact Us</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name"
                           name="name"
                           placeholder="Your Name" required>
                    <span class="error-message" id="nameError"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email"
                           name="email"
                           placeholder="Your Email" required>
                    <span class="error-message" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone"
                           name="phone"
                           placeholder="Your Phone Number" required>
                    <span class="error-message" id="phoneError"></span>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message"
                              name="message"
                              placeholder="Your Message"
                              rows="5" required></textarea>
                    <span class="error-message"
                          id="messageError"></span>
                </div>
                <button type="submit"
                        class="submit-button">
                    Send Message
                </button>
            </form>
    </div>
</main>
</body>
</html>
